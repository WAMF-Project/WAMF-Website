name: Website checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build
      - run: python3 scripts/check_site_links.py _site
